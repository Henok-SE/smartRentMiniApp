<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <style>
      .brand-title {
        font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.22em;
        fill: #0F2942;
        text-anchor: middle;
      }
      .brand-subtitle {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.26em;
        fill: #0F2942;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Logo Icon Group Centered at Top -->
  <g transform="translate(115, 10) scale(0.85)">
    <!-- Chimney -->
    <rect x="124" y="22" width="22" height="42" rx="3.5" fill="#0F2942" />
    
    <!-- House Base (Green Body) -->
    <path
      d="M 100 48 L 46 88 V 162 C 46 168.6 51.4 174 58 174 H 142 C 148.6 174 154 168.6 154 162 V 88 Z"
      fill="#00B67A"
    />
    
    <!-- Navy Roof -->
    <path
      d="M 94.2 24.8 C 97.6 22.4 102.4 22.4 105.8 24.8 L 175.2 73.8 C 179.8 77 180.2 83.6 176 87.2 L 173.5 89.3 C 169.6 92.6 163.8 92.1 160.5 88.2 L 100 44.5 L 39.5 88.2 C 36.2 92.1 30.4 92.6 26.5 89.3 L 24 87.2 C 19.8 83.6 20.2 77 24.8 73.8 Z"
      fill="#0F2942"
    />
    
    <!-- Shield Badge Outline -->
    <path
      d="M 100 97 C 107.5 94.5 120.5 93.8 124.5 99.5 C 125.8 102 126 112 125 123.5 C 123.2 136.5 112.5 147.5 100 153.5 C 87.5 147.5 76.8 136.5 75 123.5 C 74 112 74.2 102 75.5 99.5 C 79.5 93.8 92.5 94.5 100 97 Z"
      fill="#00B67A"
      stroke="#FFFFFF"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    
    <!-- Verified Checkmark -->
    <path
      d="M 89.5 124 L 97 131.5 L 112 116.5"
      stroke="#FFFFFF"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Typography: SMARTRENT ET -->
  <text x="200" y="205" class="brand-title">SMARTRENT ET</text>

  <!-- Green Accent Dividing Line -->
  <line x1="45" y1="228" x2="355" y2="228" stroke="#00B67A" stroke-width="2.8" stroke-linecap="round" />

  <!-- Subtitle Tagline -->
  <text x="200" y="258" class="brand-subtitle">GOVERNMENT-INTEGRATED</text>
  <text x="200" y="280" class="brand-subtitle">RENTAL PAYMENTS</text>
</svg>
